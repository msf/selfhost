# ZFS ARC cap for hopper.
#
# Drop into /etc/modprobe.d/zfs.conf so the cap applies on next boot. For the
# live setting (no reboot), echo the same value into
# /sys/module/zfs/parameters/zfs_arc_max.
#
# Why 8 GiB:
# - hopper has 30 GiB system RAM
# - llama-swap.service is cgroup-capped at MemoryMax=24 GiB
# - ARC default c_max is ~half of RAM (~15 GiB) → conflicts with the llm budget
# - 8 GiB is plenty for hot ZFS metadata + frequently-read media
# - prevents the OOM scenario where ARC + page-cached GGUF + heap exhausts host
#
# Reversal: remove the file (or set zfs_arc_max=0 to restore default = ~half RAM).
#
# Install:
#   sudo install -m 0644 /srv/selfhost/llm/zfs-arc.conf /etc/modprobe.d/zfs.conf
#   echo $((8*1024*1024*1024)) | sudo tee /sys/module/zfs/parameters/zfs_arc_max
#   sudo update-initramfs -u   # only if zfs is in initramfs

options zfs zfs_arc_max=8589934592
